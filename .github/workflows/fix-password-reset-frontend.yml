name: Fix password reset frontend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix literal newline escapes in Auth component
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text()
          start = text.find('function Auth(')
          end = text.find('\nfunction Page(', start)
          if start == -1 or end == -1:
              raise SystemExit('Auth component boundaries not found')
          block = text[start:end]
          block = block.replace('\\n', '\n')
          text = text[:start] + block + text[end:]
          path.write_text(text)
          print('Auth component newline formatting fixed.')
          PY
          grep -q "function Auth" src/App.jsx
          grep -q "view==='newPassword'" src/App.jsx
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git rm .github/workflows/fix-password-reset-frontend.yml
          git commit -m "Fix password reset frontend component"
          git push
