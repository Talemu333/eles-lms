name: Repair password reset
on: push
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/repairPasswordReset.py
      - run: node --check server/server.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js scripts/repairPasswordReset.py scripts/repairPasswordReset.js
          git rm .github/workflows/repair-password-reset.yml
          git commit -m "Repair password reset backend"
          git push
