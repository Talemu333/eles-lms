name: Implement password reset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement secure forgot-password functionality'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch application
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Could not find expected text for {label}')
              return text.replace(old, new, 1)

          # -------------------- server/server.js --------------------
          path = Path('server/server.js')
          text = path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              "import bcrypt from 'bcryptjs'\n",
              "import bcrypt from 'bcryptjs'\nimport { createHash, randomBytes } from 'node:crypto'\n",
              'server crypto import'
          )

          marker = "const port = Number(process.env.PORT || 5000)\n"
          table_setup = r'''

const passwordResetTableReady = pool.query(`
  CREATE TABLE IF NOT EXISTS password_reset_tokens (
    id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
    user_id BIGINT UNSIGNED NOT NULL,
    token_hash CHAR(64) NOT NULL UNIQUE,
    expires_at DATETIME NOT NULL,
    used_at DATETIME NULL,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    CONSTRAINT fk_password_reset_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
    INDEX idx_password_reset_user (user_id),
    INDEX idx_password_reset_expires (expires_at)
  ) ENGINE=InnoDB
`).catch(error => {
  console.error('[password-reset-table]', error)
  throw error
})

function hashResetToken(token) {
  return createHash('sha256').update(token).digest('hex')
}

async function sendPasswordResetEmail({ to, name, token }) {
  const apiKey = process.env.RESEND_API_KEY
  const from = process.env.MAIL_FROM
  const appUrl = String(process.env.APP_URL || '').replace(/\/$/, '')
  if (!apiKey || !from || !appUrl) throw new Error('Password reset email is not configured.')

  const resetUrl = `${appUrl}/?reset=${encodeURIComponent(token)}`
  const safeName = String(name || 'there').replace(/[<>&"']/g, '')

  const response = await fetch('https://api.resend.com/emails', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`,
      'User-Agent': 'ELES-LMS/1.0'
    },
    body: JSON.stringify({
      from,
      to: [to],
      subject: 'Reset your ELES LMS password',
      html: `
        <div style="font-family:Arial,sans-serif;line-height:1.6;max-width:600px;margin:auto">
          <h2 style="margin-bottom:8px">Password Reset</h2>
          <p>Hello ${safeName},</p>
          <p>We received a request to reset your ELES LMS password.</p>
          <p><a href="${resetUrl}" style="display:inline-block;padding:12px 18px;background:#2563eb;color:#fff;text-decoration:none;border-radius:6px">Reset Password</a></p>
          <p>This link expires in <strong>1 hour</strong> and can only be used once.</p>
          <p>If you did not request this, you can safely ignore this email.</p>
          <p style="color:#666;font-size:13px">Early Learning Services — Learning Management System</p>
        </div>
      `,
      text: `Hello ${safeName},\n\nReset your ELES LMS password using this link:\n${resetUrl}\n\nThis link expires in 1 hour and can only be used once. If you did not request this, you can ignore this email.`
    })
  })

  if (!response.ok) {
    const details = await response.text().catch(() => '')
    throw new Error(`Email provider rejected the reset email: ${response.status} ${details}`)
  }
}
'''
          text = replace_once(text, marker, marker + table_setup, 'password reset helpers')

          route_marker = "app.get('/api/auth/me', requireAuth, async (req, res) => {"
          routes = r'''
app.post('/api/auth/forgot-password', async (req, res) => {
  const genericMessage = 'If an account with that email exists, a password reset link has been sent.'
  const normalizedEmail = String(req.body?.email || '').trim().toLowerCase()
  if (!normalizedEmail) return res.json({ message: genericMessage })

  try {
    await passwordResetTableReady
    const [[user]] = await pool.query('SELECT id, name, email FROM users WHERE email = ? LIMIT 1', [normalizedEmail])
    if (!user) return res.json({ message: genericMessage })

    const token = randomBytes(32).toString('hex')
    const tokenHash = hashResetToken(token)

    await pool.query('UPDATE password_reset_tokens SET used_at = NOW() WHERE user_id = ? AND used_at IS NULL', [user.id])
    await pool.query(
      'INSERT INTO password_reset_tokens (user_id, token_hash, expires_at) VALUES (?, ?, DATE_ADD(NOW(), INTERVAL 1 HOUR))',
      [user.id, tokenHash]
    )

    try {
      await sendPasswordResetEmail({ to: user.email, name: user.name, token })
    } catch (emailError) {
      await pool.query('DELETE FROM password_reset_tokens WHERE token_hash = ?', [tokenHash])
      console.error('[forgot-password email]', emailError)
      return res.status(500).json({ message: 'Unable to send the password reset email right now. Please try again later.' })
    }

    return res.json({ message: genericMessage })
  } catch (error) {
    console.error('[forgot-password]', error)
    return res.status(500).json({ message: 'Unable to process the password reset request right now.' })
  }
})

app.post('/api/auth/reset-password', async (req, res) => {
  const token = String(req.body?.token || '').trim()
  const password = String(req.body?.password || '')
  if (!token || password.length < 6) return res.status(400).json({ message: 'A valid reset token and a password of at least 6 characters are required.' })

  const connection = await pool.getConnection()
  try {
    await passwordResetTableReady
    await connection.beginTransaction()

    const tokenHash = hashResetToken(token)
    const [rows] = await connection.query(
      'SELECT id, user_id FROM password_reset_tokens WHERE token_hash = ? AND used_at IS NULL AND expires_at > NOW() LIMIT 1 FOR UPDATE',
      [tokenHash]
    )
    if (!rows.length) {
      await connection.rollback()
      return res.status(400).json({ message: 'This password reset link is invalid or has expired. Please request a new one.' })
    }

    const passwordHash = await bcrypt.hash(password, 12)
    await connection.query('UPDATE users SET password_hash = ? WHERE id = ?', [passwordHash, rows[0].user_id])
    await connection.query('UPDATE password_reset_tokens SET used_at = NOW() WHERE id = ?', [rows[0].id])
    await connection.commit()

    res.json({ message: 'Password reset successful. You can now log in with your new password.' })
  } catch (error) {
    await connection.rollback().catch(() => {})
    console.error('[reset-password]', error)
    res.status(500).json({ message: 'Unable to reset the password right now.' })
  } finally {
    connection.release()
  }
})

'''
          text = replace_once(text, route_marker, routes + route_marker, 'password reset routes')
          path.write_text(text, encoding='utf-8')

          # -------------------- src/api.js --------------------
          path = Path('src/api.js')
          text = path.read_text(encoding='utf-8')
          marker = "export async function getCurrentUser() {"
          additions = r'''
export async function forgotPassword(email) {
  return request('/api/auth/forgot-password', {
    method: 'POST',
    body: JSON.stringify({ email })
  })
}

export async function resetPassword(token, password) {
  return request('/api/auth/reset-password', {
    method: 'POST',
    body: JSON.stringify({ token, password })
  })
}

'''
          text = replace_once(text, marker, additions + marker, 'password reset api functions')
          path.write_text(text, encoding='utf-8')

          # -------------------- src/App.jsx --------------------
          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          old_import = "import { clearToken, getCurrentUser, login as apiLogin, register as apiRegister, getToken } from './api.js'"
          new_import = "import { clearToken, forgotPassword, getCurrentUser, login as apiLogin, register as apiRegister, resetPassword, getToken } from './api.js'"
          text = replace_once(text, old_import, new_import, 'App api imports')

          text = replace_once(
              text,
              "const [authView,setAuthView]=useState('login')",
              "const [authView,setAuthView]=useState(()=>new URLSearchParams(window.location.search).get('reset')?'newPassword':'login')",
              'App reset view state'
          )

          old_auth = re.compile(r"function Auth\(\{role,setRole,view,setView,onLogin,registerUser,message,setMessage\}\)\{.*?\n\}\n\nfunction Page", re.S)
          new_auth = r'''function Auth({role,setRole,view,setView,onLogin,registerUser,message,setMessage}){
 const [name,setName]=useState(''),[email,setEmail]=useState(''),[password,setPassword]=useState(''),[resetEmail,setResetEmail]=useState(''),[newPassword,setNewPassword]=useState(''),[confirmPassword,setConfirmPassword]=useState(''),[busy,setBusy]=useState(false)
 const resetToken=new URLSearchParams(window.location.search).get('reset')||''
 const register=async()=>{if(!name.trim()||!email.trim()||!password)return setMessage('Please complete all fields.');setBusy(true);try{await registerUser(name,email,password)}finally{setBusy(false)}}
 const login=async()=>{if(!email.trim()||!password)return setMessage('Please enter your email and password.');setBusy(true);try{await onLogin(email,password)}finally{setBusy(false)}}
 const reset=async()=>{if(!resetEmail.trim())return setMessage('Please enter your email address.');setBusy(true);try{const result=await forgotPassword(resetEmail.trim().toLowerCase());setMessage(result.message||'If an account exists, a password reset link has been sent.')}catch(error){setMessage(error.message||'Unable to send the password reset email.')}finally{setBusy(false)}}
 const updatePassword=async()=>{if(!resetToken)return setMessage('This password reset link is invalid. Please request a new one.');if(newPassword.length<6)return setMessage('Password must be at least 6 characters.');if(newPassword!==confirmPassword)return setMessage('The passwords do not match.');setBusy(true);try{const result=await resetPassword(resetToken,newPassword);setMessage(result.message||'Password reset successful.');window.history.replaceState({},'',window.location.pathname);setView('login');setResetEmail('');setNewPassword('');setConfirmPassword('')}catch(error){setMessage(error.message||'Unable to reset the password.')}finally{setBusy(false)}}
 return <div className="auth"><div className="auth-box"><h1>Early Learning Services</h1><p className="muted"><i className="fa-solid fa-child-reaching"></i> Early Childhood Learning Management System</p>{view!=='newPassword'&&<div className="role-switch"><button className={role==='student'?'active':''} onClick={()=>{setRole('student');setMessage('')}}>Student</button><button className={role==='instructor'?'active':''} onClick={()=>{setRole('instructor');setMessage('')}}>Instructor</button></div>}{message&&<div className="info-box">{message}</div>}{view==='login'&&<><Field label="Email"><input type="email" placeholder="Enter email" value={email} onChange={e=>setEmail(e.target.value)} disabled={busy}/></Field><Field label="Password"><input type="password" placeholder="Enter password" value={password} onChange={e=>setPassword(e.target.value)} disabled={busy}/></Field><button className="btn btn-primary" onClick={login} disabled={busy}><i className="fa-solid fa-right-to-bracket"></i> {busy?'Logging in...':'Login'}</button><button className="btn btn-light" onClick={()=>{setView('register');setMessage('')}} disabled={busy}>Create Account</button><p style={{textAlign:'center',marginTop:16}}><a href="#reset" onClick={e=>{e.preventDefault();setView('reset');setMessage('')}}>Forgot Password?</a></p></>}{view==='register'&&<><Field label="Full Name"><input value={name} onChange={e=>setName(e.target.value)} disabled={busy}/></Field><Field label="Email"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} disabled={busy}/></Field><Field label="Password"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} disabled={busy}/></Field><button className="btn btn-primary" onClick={register} disabled={busy}>{busy?'Creating Account...':'Create Account'}</button><button className="btn btn-light" onClick={()=>{setView('login');setMessage('')}} disabled={busy}>Back to Login</button></>}{view==='reset'&&<><p className="muted">Enter your email to receive a secure password reset link.</p><Field label="Email"><input type="email" placeholder="Enter your account email" value={resetEmail} onChange={e=>setResetEmail(e.target.value)} disabled={busy}/></Field><button className="btn btn-primary" onClick={reset} disabled={busy}>{busy?'Sending...':'Send Reset Link'}</button><button className="btn btn-light" onClick={()=>{setView('login');setMessage('')}} disabled={busy}>Back to Login</button></>}{view==='newPassword'&&<><p className="muted">Choose a new password for your account.</p><Field label="New Password"><input type="password" placeholder="At least 6 characters" value={newPassword} onChange={e=>setNewPassword(e.target.value)} disabled={busy}/></Field><Field label="Confirm Password"><input type="password" placeholder="Enter password again" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} disabled={busy}/></Field><button className="btn btn-primary" onClick={updatePassword} disabled={busy}>{busy?'Resetting Password...':'Reset Password'}</button><button className="btn btn-light" onClick={()=>{window.history.replaceState({},'',window.location.pathname);setView('login');setMessage('')}} disabled={busy}>Back to Login</button></>}</div></div>
}

function Page'''
          text, count = old_auth.subn(new_auth, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace Auth component')
          path.write_text(text, encoding='utf-8')

          # -------------------- env example --------------------
          path = Path('server/.env.example')
          text = path.read_text(encoding='utf-8')
          if 'RESEND_API_KEY=' not in text:
              text += '\nRESEND_API_KEY=\nMAIL_FROM=ELES LMS <noreply@eles-lms.org>\nAPP_URL=https://www.eles-lms.org\n'
          path.write_text(text, encoding='utf-8')

          # -------------------- database documentation --------------------
          write('database/password_reset.sql', '''CREATE TABLE IF NOT EXISTS password_reset_tokens (
  id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
  user_id BIGINT UNSIGNED NOT NULL,
  token_hash CHAR(64) NOT NULL UNIQUE,
  expires_at DATETIME NOT NULL,
  used_at DATETIME NULL,
  created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
  CONSTRAINT fk_password_reset_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
  INDEX idx_password_reset_user (user_id),
  INDEX idx_password_reset_expires (expires_at)
) ENGINE=InnoDB;
''')
          PY

      - name: Commit changes and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-forgot-password.yml
          git add server/server.js server/.env.example src/api.js src/App.jsx database/password_reset.sql
          git commit -m "Implement secure forgot-password functionality"
          git push
