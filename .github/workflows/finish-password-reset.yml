# Temporary one-time workflow: patch password reset implementation.
name: Finish password reset implementation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-password-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch password reset backend and frontend
        run: |
          node <<'NODE'
          const fs = require('fs')
          const serverPath = 'server/server.js'
          let server = fs.readFileSync(serverPath, 'utf8')
          if (!server.includes('PASSWORD_RESET_IMPLEMENTED')) {
            server = server.replace("import bcrypt from 'bcryptjs'\n", "import bcrypt from 'bcryptjs'\nimport { createHash, randomBytes } from 'node:crypto'\n")
            const routes = String.raw`\n// PASSWORD_RESET_IMPLEMENTED\nconst PASSWORD_RESET_TABLE_SQL = \`\n  CREATE TABLE IF NOT EXISTS password_reset_tokens (\n    id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n    user_id BIGINT UNSIGNED NOT NULL,\n    token_hash CHAR(64) NOT NULL UNIQUE,\n    expires_at DATETIME NOT NULL,\n    used_at DATETIME NULL,\n    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    CONSTRAINT fk_password_reset_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    INDEX idx_password_reset_user (user_id),\n    INDEX idx_password_reset_expires (expires_at)\n  ) ENGINE=InnoDB\n\`\nasync function ensurePasswordResetTable() { await pool.query(PASSWORD_RESET_TABLE_SQL) }\nfunction hashResetToken(token) { return createHash('sha256').update(token).digest('hex') }\nasync function sendPasswordResetEmail(to, resetUrl) {\n  const apiKey = process.env.RESEND_API_KEY\n  const from = process.env.MAIL_FROM || 'ELES LMS <noreply@eles-lms.org>'\n  if (!apiKey) throw new Error('RESEND_API_KEY is not configured.')\n  const response = await fetch('https://api.resend.com/emails', { method: 'POST', headers: { Authorization: \`Bearer \${apiKey}\`, 'Content-Type': 'application/json' }, body: JSON.stringify({ from, to: [to], subject: 'Reset your ELES LMS password', html: \`<h2>ELES LMS Password Reset</h2><p>We received a request to reset your password.</p><p><a href="\${resetUrl}">Reset Password</a></p><p>This link expires in 1 hour and can only be used once.</p>\` }) })\n  const body = await response.json().catch(() => ({}))\n  if (!response.ok) throw new Error(body.message || 'Resend rejected the email.')\n}\napp.post('/api/auth/forgot-password', async (req, res) => {\n  const normalizedEmail = String(req.body?.email || '').trim().toLowerCase()\n  if (!normalizedEmail) return res.status(400).json({ message: 'Email is required.' })\n  try {\n    await ensurePasswordResetTable()\n    const [users] = await pool.query('SELECT id, email FROM users WHERE email = ? LIMIT 1', [normalizedEmail])\n    if (users.length) {\n      const token = randomBytes(32).toString('hex')\n      const tokenHash = hashResetToken(token)\n      await pool.query('DELETE FROM password_reset_tokens WHERE user_id = ? OR expires_at < NOW() OR used_at IS NOT NULL', [users[0].id])\n      await pool.query('INSERT INTO password_reset_tokens (user_id, token_hash, expires_at) VALUES (?, ?, DATE_ADD(NOW(), INTERVAL 1 HOUR))', [users[0].id, tokenHash])\n      const appUrl = (process.env.APP_URL || 'http://localhost:5173').replace(/\\/$/, '')\n      const resetUrl = \`\${appUrl}/?reset=\${encodeURIComponent(token)}\`\n      try { await sendPasswordResetEmail(users[0].email, resetUrl) } catch (mailError) { console.error('[password-reset-email]', mailError); await pool.query('DELETE FROM password_reset_tokens WHERE token_hash = ?', [tokenHash]) }\n    }\n    return res.json({ message: 'If an account exists for that email, a password reset link has been sent.' })\n  } catch (error) { console.error('[forgot-password]', error); return res.status(500).json({ message: 'Unable to process the password reset request.' }) }\n})\napp.post('/api/auth/reset-password', async (req, res) => {\n  const token = String(req.body?.token || '').trim()\n  const password = String(req.body?.password || '')\n  if (!token || !password) return res.status(400).json({ message: 'Reset token and new password are required.' })\n  if (password.length < 6) return res.status(400).json({ message: 'Password must be at least 6 characters.' })\n  const connection = await pool.getConnection()\n  try {\n    await connection.beginTransaction()\n    await connection.query(PASSWORD_RESET_TABLE_SQL)\n    const [rows] = await connection.query('SELECT id, user_id FROM password_reset_tokens WHERE token_hash = ? AND used_at IS NULL AND expires_at > NOW() LIMIT 1 FOR UPDATE', [hashResetToken(token)])\n    if (!rows.length) { await connection.rollback(); return res.status(400).json({ message: 'This password reset link is invalid or has expired.' }) }\n    const passwordHash = await bcrypt.hash(password, 12)\n    await connection.query('UPDATE users SET password_hash = ? WHERE id = ?', [passwordHash, rows[0].user_id])\n    await connection.query('UPDATE password_reset_tokens SET used_at = NOW() WHERE id = ?', [rows[0].id])\n    await connection.commit()\n    return res.json({ message: 'Password reset successful. You can now log in with your new password.' })\n  } catch (error) { await connection.rollback().catch(() => {}); console.error('[reset-password]', error); return res.status(500).json({ message: 'Unable to reset the password.' }) } finally { connection.release() }\n})\n`\n            const marker = "// Course data is always read from the server/database. Do not use browser"\n            if (!server.includes(marker)) throw new Error('Could not find server insertion marker.')\n            server = server.replace(marker, routes + "\n" + marker)\n            fs.writeFileSync(serverPath, server)\n          }

          const appPath = 'src/App.jsx'
          let app = fs.readFileSync(appPath, 'utf8')
          app = app.replace("import { clearToken, getCurrentUser, login as apiLogin, register as apiRegister, getToken } from './api.js'", "import { clearToken, getCurrentUser, login as apiLogin, register as apiRegister, forgotPassword, resetPassword, getToken } from './api.js'")
          app = app.replace(" const [authView,setAuthView]=useState('login')", " const resetTokenFromUrl=typeof window!=='undefined'?new URLSearchParams(window.location.search).get('reset'):null\n const [authView,setAuthView]=useState(()=>resetTokenFromUrl?'newPassword':'login')\n const [resetToken,setResetToken]=useState(resetTokenFromUrl||'')")
          app = app.replace("return <Auth role={role} setRole={setRole} view={authView} setView={setAuthView} onLogin={login} registerUser={registerUser} message={message} setMessage={setMessage}/>", "return <Auth role={role} setRole={setRole} view={authView} setView={setAuthView} resetToken={resetToken} onLogin={login} registerUser={registerUser} message={message} setMessage={setMessage}/>")
          const authStart = app.indexOf('function Auth(')
          const pageStart = app.indexOf('\nfunction Page(', authStart)
          if (authStart < 0 || pageStart < 0) throw new Error('Could not locate Auth component.')
          const authComponent = String.raw`function Auth({role,setRole,view,setView,resetToken,onLogin,registerUser,message,setMessage}){\n const [name,setName]=useState(''),[email,setEmail]=useState(''),[password,setPassword]=useState(''),[resetEmail,setResetEmail]=useState(''),[newPassword,setNewPassword]=useState(''),[confirmPassword,setConfirmPassword]=useState(''),[busy,setBusy]=useState(false)\n const register=async()=>{if(!name.trim()||!email.trim()||!password)return setMessage('Please complete all fields.');setBusy(true);try{await registerUser(name,email,password)}finally{setBusy(false)}}\n const login=async()=>{if(!email.trim()||!password)return setMessage('Please enter your email and password.');setBusy(true);try{await onLogin(email,password)}finally{setBusy(false)}}\n const reset=async()=>{if(!resetEmail.trim())return setMessage('Please enter your email address.');setBusy(true);setMessage('');try{const result=await forgotPassword(resetEmail.trim().toLowerCase());setMessage(result.message||'If an account exists for that email, a password reset link has been sent.')}catch(error){setMessage(error.message||'Unable to send reset link.')}finally{setBusy(false)}}\n const changePassword=async()=>{if(newPassword.length<6)return setMessage('Password must be at least 6 characters.');if(newPassword!==confirmPassword)return setMessage('Passwords do not match.');if(!resetToken)return setMessage('This reset link is invalid.');setBusy(true);setMessage('');try{const result=await resetPassword(resetToken,newPassword);setMessage(result.message||'Password reset successful.');setNewPassword('');setConfirmPassword('');if(typeof window!=='undefined'){window.history.replaceState({},'',window.location.pathname);window.setTimeout(()=>setView('login'),800)}}catch(error){setMessage(error.message||'Unable to reset your password.')}finally{setBusy(false)}}\n return <div className="auth"><div className="auth-box"><h1>Early Learning Services</h1><p className="muted"><i className="fa-solid fa-child-reaching"></i> Early Childhood Learning Management System</p>{(view==='login'||view==='register'||view==='reset')&&<div className="role-switch"><button className={role==='student'?'active':''} onClick={()=>{setRole('student');setMessage('')}}>Student</button><button className={role==='instructor'?'active':''} onClick={()=>{setRole('instructor');setMessage('')}}>Instructor</button></div>}{message&&<div className="info-box">{message}</div>}{view==='login'&&<><Field label="Email"><input type="email" placeholder="Enter email" value={email} onChange={e=>setEmail(e.target.value)} disabled={busy}/></Field><Field label="Password"><input type="password" placeholder="Enter password" value={password} onChange={e=>setPassword(e.target.value)} disabled={busy}/></Field><button className="btn btn-primary" onClick={login} disabled={busy}><i className="fa-solid fa-right-to-bracket"></i> {busy?'Logging in...':'Login'}</button><button className="btn btn-light" onClick={()=>{setView('register');setMessage('')}} disabled={busy}>Create Account</button><p style={{textAlign:'center',marginTop:16}}><a href="#reset" onClick={e=>{e.preventDefault();setView('reset');setMessage('')}}>Forgot Password?</a></p></>}{view==='register'&&<><Field label="Full Name"><input value={name} onChange={e=>setName(e.target.value)} disabled={busy}/></Field><Field label="Email"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} disabled={busy}/></Field><Field label="Password"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} disabled={busy}/></Field><button className="btn btn-primary" onClick={register} disabled={busy}>{busy?'Creating Account...':'Create Account'}</button><button className="btn btn-light" onClick={()=>{setView('login');setMessage('')}} disabled={busy}>Back to Login</button></>}{view==='reset'&&<><p className="muted">Enter your email to receive a password reset link.</p><Field label="Email"><input type="email" placeholder="Enter your account email" value={resetEmail} onChange={e=>setResetEmail(e.target.value)} disabled={busy}/></Field><button className="btn btn-primary" onClick={reset} disabled={busy}>{busy?'Sending...':'Send Reset Link'}</button><button className="btn btn-light" onClick={()=>{setView('login');setMessage('')}} disabled={busy}>Back to Login</button></>}{view==='newPassword'&&<><p className="muted">Choose a new password for your ELES LMS account.</p><Field label="New Password"><input type="password" placeholder="At least 6 characters" value={newPassword} onChange={e=>setNewPassword(e.target.value)} disabled={busy}/></Field><Field label="Confirm Password"><input type="password" placeholder="Re-enter your new password" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} disabled={busy}/></Field><button className="btn btn-primary" onClick={changePassword} disabled={busy}>{busy?'Resetting...':'Reset Password'}</button><button className="btn btn-light" onClick={()=>{if(typeof window!=='undefined'){window.history.replaceState({},'',window.location.pathname)}setView('login');setMessage('')}} disabled={busy}>Back to Login</button></>}</div></div>\n}\n`
          app = app.slice(0, authStart) + authComponent + app.slice(pageStart)
          fs.writeFileSync(appPath, app)
          console.log('Patch complete')
          NODE

      - name: Verify
        run: |
          grep -q "PASSWORD_RESET_IMPLEMENTED" server/server.js
          grep -q "view==='newPassword'" src/App.jsx
          echo "Password reset implementation verified."

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js src/App.jsx
          git rm .github/workflows/finish-password-reset.yml
          git commit -m "Implement password reset flow"
          git push
